name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 预装 Android SDK（/usr/local/lib/android/sdk），但 sdkmanager
      # 不在 PATH 且版本目录名会变；这里自行定位，避免依赖会安装已下架 tools 包的第三方 action。
      - name: Set up Android SDK 35
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | head -1)
          if [ -z "$SDKM" ]; then SDKM="$SDK/tools/bin/sdkmanager"; fi
          echo "ANDROID_HOME=$SDK" | tee -a "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdkmanager=$SDKM"
          test -x "$SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 公开源码仓库不含小米私有 libmiocr.so（见 jniLibs/arm64-v8a/README.md），
      # 所以这里只做 Java / 资源编译校验，不产出「没有引擎的空壳 APK」误导使用者。
      # 带 so 的完整成品 APK 与源码包由维护者在本地构建后上传到 Release 附件。
      - name: 编译校验（Java / 资源）
        run: ./gradlew compileReleaseJavaWithJavac processReleaseResources --no-daemon

      - name: 说明
        run: |
          echo "::notice::公开源码仓库不含小米私有 libmiocr.so；此 workflow 仅做编译校验。完整 APK 与源码包请到 Release 下载，或按 app/src/main/jniLibs/arm64-v8a/README.md 放置 so 后自行构建。"
